[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["docs/archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["theGUI/build.py", "theGUI/package.py"]
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[tool.coverage.run]
branch = true
source = ["theGUI", "scripts", "tests"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "coverage/python-html"
