name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks 8.18.4
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_8.18.4_linux_x64.tar.gz"
          report="${RUNNER_TEMP}/gitleaks-report.json"
          printf '[]\n' > "${report}"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            --output "${archive}"
          printf '%s  %s\n' \
            ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d \
            "${archive}" | sha256sum --check
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          test "$("${RUNNER_TEMP}/gitleaks" version)" = "8.18.4"

      - name: Verify scanner with a redacted canary
        shell: bash
        run: |
          set -euo pipefail
          canary_source="${RUNNER_TEMP}/gitleaks-canary-source"
          canary_output="${RUNNER_TEMP}/gitleaks-canary-output"
          mkdir -p "${canary_source}" "${canary_output}"
          canary_part_one='aBcDeFgHiJkLmNoPqR'
          canary_part_two='sTuVwXyZ0123456789'
          canary_value="ghp_${canary_part_one}${canary_part_two}"
          printf 'token = "%s"\n' "${canary_value}" > "${canary_source}/canary.txt"

          set +e
          "${RUNNER_TEMP}/gitleaks" detect \
            --no-git \
            --source "${canary_source}" \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path "${canary_output}/report.json" \
            >"${canary_output}/scan.log" 2>&1
          canary_status=$?
          set -e

          if [[ ${canary_status} -ne 1 ]] || [[ ! -s "${canary_output}/report.json" ]]; then
            echo "::error::Gitleaks failed to detect the generated canary"
            exit 1
          fi
          if grep -Fq -- "${canary_value}" \
            "${canary_output}/report.json" "${canary_output}/scan.log"; then
            echo "::error::Gitleaks emitted an unredacted canary"
            exit 1
          fi
          echo "Gitleaks canary detected and fully redacted"

      - name: Scan pull-request commit range
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "${RUNNER_TEMP}/gitleaks" detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path "${RUNNER_TEMP}/gitleaks-report.json"

      - name: Scan complete Git history
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          "${RUNNER_TEMP}/gitleaks" detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path "${RUNNER_TEMP}/gitleaks-report.json"

      - name: Upload redacted Gitleaks report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report-${{ github.run_id }}
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL for Python and Actions
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: python, actions
          build-mode: none
          queries: security-extended

      - name: Analyze Python and Actions
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

  dependency-review:
    name: dependency-review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
